<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Buddy</title>
  <meta name="description" content="Turn your PDFs into quizzes, flashcards and an exam study plan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='18' rx='2' fill='%23fff' stroke='%232C5BA8' stroke-width='2'/%3E%3Cpath d='M3 12h26' stroke='%23D2443F' stroke-width='2'/%3E%3Cpath d='M7 17h18M7 21h12' stroke='%232C5BA8' stroke-width='1.5'/%3E%3C/svg%3E">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <a class="brand" href="#/">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="7" width="26" height="18" rx="2" fill="var(--card)" stroke="var(--blue)" stroke-width="2"/><path d="M3 12h26" stroke="var(--again)" stroke-width="2"/><path d="M7 17h18M7 21h12" stroke="var(--blue)" stroke-width="1.5"/></svg>
        <span>Study Buddy</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="home">Today</a>
        <a href="#/subjects" data-nav="subjects">Subjects</a>
        <a href="#/cards" data-nav="cards">Flashcards</a>
        <a href="#/notes" data-nav="notes">Notes</a>
        <a href="#/calendar" data-nav="calendar">Calendar</a>
        <a href="#/settings" data-nav="settings">Settings</a>
      </nav>
      <p class="side-foot" id="keyStatus"></p>
    </aside>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
  <div id="modalRoot"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <!-- pdf.js: the worker is loaded as a plain script so parsing runs on the main thread (works from file://) -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"></script>
  <!-- KaTeX: typesets LaTeX math in questions, cards and notes -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

  <script src="js/version.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/groq.js"></script>
  <script src="js/docs.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/exhibits.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/share.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/subjects.js"></script>
  <script src="js/views/quiz.js"></script>
  <script src="js/views/cards.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/notes.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
